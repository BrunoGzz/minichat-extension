<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with your friends! - Chats</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../lib/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/toastify.min.css">
</head>
<body>
    <header class="border-bottom m-0 chat-header">
        <a class="turn-back ms-2 text-dark text-decoration-none" href="./chats.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" fill="currentColor" class="bi bi-caret-left" viewBox="0 0 16 16">
                <path d="M10 12.796V3.204L4.519 8 10 12.796zm-.659.753-5.48-4.796a1 1 0 0 1 0-1.506l5.48-4.796A1 1 0 0 1 11 3.204v9.592a1 1 0 0 1-1.659.753z"/>
            </svg>
        </a>
        <div id="profile-info">

        </div>
    </header>
    <div class="w-100" id="messages">
        <div class="text-secondary delete-auto-info">Messages sent more than a week ago are automatically deleted</div>
        <div class="send-info">
            Here starts your conversation.
        </div>
        <div id="totalMessages">

        </div>
    </div>
    <div class="input-group message-input">
        <input type="text" id="chat-input" class="chat-input form-control" placeholder="Write a message..." maxlength="999" autocomplete="off">
        <button class="emoji-btn-containter emoji-btn">
            <svg class="emoji-btn" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-emoji-laughing" viewBox="0 0 16 16">
                <path class="emoji-btn" d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                <path class="emoji-btn" d="M12.331 9.5a1 1 0 0 1 0 1A4.998 4.998 0 0 1 8 13a4.998 4.998 0 0 1-4.33-2.5A1 1 0 0 1 4.535 9h6.93a1 1 0 0 1 .866.5zM7 6.5c0 .828-.448 0-1 0s-1 .828-1 0S5.448 5 6 5s1 .672 1 1.5zm4 0c0 .828-.448 0-1 0s-1 .828-1 0S9.448 5 10 5s1 .672 1 1.5z"/>
            </svg>
            <svg id="stickers-btn" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sticky" viewBox="0 0 16 16">
                <path d="M2.5 1A1.5 1.5 0 0 0 1 2.5v11A1.5 1.5 0 0 0 2.5 15h6.086a1.5 1.5 0 0 0 1.06-.44l4.915-4.914A1.5 1.5 0 0 0 15 8.586V2.5A1.5 1.5 0 0 0 13.5 1zM2 2.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5V8H9.5A1.5 1.5 0 0 0 8 9.5V14H2.5a.5.5 0 0 1-.5-.5zm7 11.293V9.5a.5.5 0 0 1 .5-.5h4.293z"/>
            </svg>
        </button>
        <button class="btn btn-outline-primary" type="button" id="button-send-message">Send</button>
    </div>
    <div id="context-menu">
        <span id="delete" class="context-menu-item">Delete</span>
        <hr>
        <span id="deleteFriend" class="context-menu-item">Block</span>
    </div>
    <div id="deleteUser" class="modalchat">
        <div class="modalchat-content">
            <div class="border-bottom mb-3">
                <h4 class="title">Confirm action</h4>
            </div>
            <div>
                <p class="lh-1">Click <b>CONFIRM</b> to delete all the messages and delete the friend request.</p>
                <input type="button" value="Confirm" class="btn btn-primary w-100 p-0 mb-1" style="height: 25px; font-size: 14px;" id="confirmDeleteUser">
                <input type="button" value="Cancel" class="btn close w-100 p-0 btn-outline-secondary" style="height: 25px; font-size: 14px;">
            </div>
        </div> 
    </div>
    <div id="stickersPopup" style="overflow-y: scroll; z-index: 10000; height: auto; max-height: 65%; border-radius: 0px 0px 5px 5px;
    box-shadow: 0px 3px 20px 0px rgba(0, 0, 0, 0.62);" class="p-3 d-none w-100 top-0 position-absolute left-0 right-0 bg-white border-bottom">
        <h4 class="title">Send a sticker</h4>    
        <div id="stickersContainer">
        </div>
    </div>
    <script src="../lib/luxon.min.js"></script>
    <script src="../lib/vanillaEmojiPicker.js"></script>
    <script src="../lib/toastify.min.js"></script>
    <script src="../lib/popper.min.js"></script>
    <script src="../lib/bootstrap.min.js"></script>
    <script src="../js/chat.js"></script>
    <script src="../js/sidebar.js"></script>
</body>
