<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with your friends!</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../lib/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/toastify.min.css">
</head>
<body style="width: 285px;height: 350px;">
    <div class="vote-stars lh-1 border" id="vote-stars">
        ¿Are you enjoying MiniChat 👀?<br><br>
        <a href="https://chrome.google.com/webstore/detail/randomcats-just-random-ph/cfjpjbokkcbghmdieflchhklaldlhfkm">Write us a review on Google 🤩!</a>
        <span class="d-block my-2 mb-4">⭐️⭐️⭐️⭐️⭐️</span>
        <button class="btn btn-sm btn-primary w-75 mx-3" id="close-vote-button">
            I'll do it later
        </button>
        <button class="btn btn-sm btn-link w-50" id="close-vote-button-always">
            Don't show again
        </button>
    </div>
    <script src="../lib/toastify.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
